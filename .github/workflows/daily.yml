name: 每日更新吉林大学通知
on:
  schedule:
    - cron: '0 1 * * *' # 每天北京时间09:00
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-jlu-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Scan university public notices
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTICE_TO: ${{ secrets.NOTICE_TO }}
          NOTICE_FROM: ${{ secrets.NOTICE_FROM }}
        run: python collector.py
      - name: Save new notice data
        if: always()
        run: |
          git config user.name 'jlu-notice-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/notices.json
          git diff --cached --quiet || (git commit -m 'Daily JLU notice data update' && git push)
