<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>吉大企业管理学硕 · 机会雷达</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft Yahei",sans-serif;background:#f3f6fb;color:#1f2d46}*{box-sizing:border-box}body{margin:0}main{max-width:1150px;margin:0 auto;padding:26px 20px 80px}header{padding:35px;border-radius:24px;background:linear-gradient(120deg,#102c64,#315fb8);color:#fff}h1{font-size:30px;margin:8px 0 12px}header p{color:#dce8ff;line-height:1.7;margin:0}.tag{display:inline-block;border:1px solid #ffffff55;border-radius:20px;padding:5px 12px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:18px 0}.stat,.panel,.notice{border:1px solid #e1e7f2;background:#fff;border-radius:17px;box-shadow:0 4px 14px #1b325009}.stat{padding:20px}.stat .value{font-size:32px;font-weight:750;color:#2454a5}.hint,.muted{color:#71809a;font-size:13px}.panel{padding:23px;margin:18px 0}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select,button{font:inherit;border-radius:10px;padding:11px;border:1px solid #d9e2f0}input[type=search]{flex:2;min-width:200px}select{flex:1;min-width:180px}button{cursor:pointer;background:#2553a3;color:#fff;border:0}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{color:#4f6485;background:#eef3fb;padding:9px 12px}.chip.active{background:#2553a3;color:#fff}h2{font-size:20px;margin:0 0 16px}.notice{padding:20px;margin:13px 0}.notice h3{font-size:17px;margin:10px 0}.notice a{color:#164592;text-decoration:none}.notice a:hover{text-decoration:underline}.meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;color:#7888a3;font-size:12px}.pill{display:inline-block;border-radius:7px;background:#eaf1ff;color:#315bac;padding:5px 9px}.urgent{background:#fff0e5;color:#b65722}.ended{background:#f0f1f4;color:#69758a}.notice p{font-size:14px;line-height:1.7;color:#546480}.bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.bar{height:7px;background:#eaf0fa;border-radius:9px;overflow:hidden;margin:6px 0 12px}.bar span{display:block;background:#426bc0;height:100%}footer{font-size:12px;color:#77869b;line-height:1.8;margin-top:25px}#sources{display:flex;gap:8px;flex-wrap:wrap}.source{background:#f3f6fb;padding:10px 13px;border-radius:9px;font-size:12px}.error{color:#b45631}.okay{color:#29725e}@media(max-width:700px){h1{font-size:25px}.grid{grid-template-columns:repeat(2,1fr)}.stat{padding:14px}header{padding:24px}main{padding:14px 12px}.panel{padding:16px}}
</style></head><body><main><header><div class="tag">JLU · OPPORTUNITY RADAR</div><h1>企业管理学硕 · 机会雷达</h1><p>吉林大学商学与管理学院｜为企业管理学术型硕士精选公开通知</p><p id="updated" style="font-size:13px;margin-top:18px">读取采集数据中…</p></header>
<section class="grid"><div class="stat"><div class="value" id="total">—</div><div class="hint">收录通知</div></div><div class="stat"><div class="value" id="recent">—</div><div class="hint">近7天发布</div></div><div class="stat"><div class="value" id="due">—</div><div class="hint">7天内截止</div></div><div class="stat"><div class="value" id="new">—</div><div class="hint">本次新增</div></div></section>
<section class="panel"><h2>精确筛选</h2><div class="tools"><input type="search" id="search" placeholder="搜索奖学金、竞赛、项目、讲座…"><select id="order"><option value="publish">最近发布优先</option><option value="deadline">临近截止优先</option><option value="priority">学院来源优先</option></select><button id="reload">刷新</button></div><div id="chips" class="chips"></div><p style="font-size:13px;color:#657693"><label><input type="checkbox" id="eligible"> 隐藏明显不适用于企业管理学硕的通知</label>　<label><input type="checkbox" id="active"> 隐藏已过截止日期的通知</label></p></section>
<section class="panel"><h2>通知总览 <span id="count" class="hint"></span></h2><div id="notices">加载中…</div></section>
<section class="panel"><h2>公开网站采集状态</h2><div id="sources"></div></section>
<footer>本网页并非吉林大学官方服务，只读取学校公开网站，不使用学校账号或绕过 OA 登录。智能分类、资格和截止日期由规则估计，存在漏报或误判；申报资格、时间及附件以原始通知为准。GitHub Actions 定时运行可能延迟或失败。</footer></main>
<script>
let items=[],category='全部',sources=[];const $=id=>document.getElementById(id);
const today=()=>new Date(new Date().toLocaleDateString('en-US',{timeZone:'Asia/Shanghai'}));
const days=s=>s?Math.round((new Date(s+'T12:00:00')-today())/86400000):null;
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function badge(n){if(!n.deadline)return '<span class="pill">截止日未核实</span>';const d=days(n.deadline);return d<0?'<span class="pill ended">已截止</span>':d<=7?'<span class="pill urgent">'+(d===0?'今天截止':'剩余'+d+'天')+'</span>':'<span class="pill">截止 '+safe(n.deadline)+'</span>'}
function draw(){const q=$('search').value.toLowerCase(),filter=$('eligible').checked,active=$('active').checked,order=$('order').value;
let a=items.filter(n=>(category==='全部'||n.category===category)&&(!filter||n.eligibility!=='明显不适用')&&(!active||!n.deadline||days(n.deadline)>=0)&&[n.title,n.summary,n.source,n.category].join(' ').toLowerCase().includes(q));
a.sort((x,y)=>order==='deadline'?(x.deadline||'9999').localeCompare(y.deadline||'9999'):order==='priority'?(y.priority||0)-(x.priority||0)||(y.published||'').localeCompare(x.published||''):(y.published||'').localeCompare(x.published||''));
$('count').textContent='共'+a.length+'条';
$('notices').innerHTML=a.length?a.map(n=>'<article class="notice"><div class="meta"><span class="pill">'+safe(n.category)+'</span>'+badge(n)+'<span>'+safe(n.eligibility||'适用资格需核实')+'</span><span>发布：'+safe(n.published||'待核实')+'</span></div><h3><a target="_blank" rel="noopener noreferrer" href="'+safe(n.url)+'">'+safe(n.title)+'</a></h3><p>'+safe(n.summary||'请查看原文确认具体事项。')+'</p><div class="bottom"><span class="muted">来源：'+safe(n.source)+'</span><a href="'+safe(n.url)+'" target="_blank" rel="noopener noreferrer">查看原始通知 ↗</a></div></article>').join(''):'<p class="muted">暂无符合筛选条件的通知。首次扫描前数据为空属于正常情况。</p>'}
async function boot(){try{const r=await fetch('data/notices.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();items=d.notices||[];sources=d.sources||[];
$('updated').textContent='最近采集：'+(d.updated||'尚未开始')+(d.mode==='public-only'?' · 仅公开网页':'');
$('total').textContent=items.length;$('recent').textContent=items.filter(n=>n.published&&days(n.published)>=-6&&days(n.published)<=0).length;
$('due').textContent=items.filter(n=>n.deadline&&days(n.deadline)>=0&&days(n.deadline)<=7).length;$('new').textContent=d.new_count||0;
const cs=['全部',...new Set(items.map(n=>n.category||'其他'))];$('chips').innerHTML=cs.map(n=>'<button class="chip '+(n===category?'active':'')+'" data-c="'+safe(n)+'">'+safe(n)+'</button>').join('');
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{category=b.dataset.c;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));draw()});
$('sources').innerHTML=sources.length?sources.map(s=>'<div class="source"><span class="'+(s.ok?'okay':'error')+'">'+(s.ok?'● 正常':'● 失败')+'</span> '+safe(s.name)+' · '+safe(s.count??0)+'条</div>').join(''):'<p class="muted">首次采集尚未执行。</p>';draw()}catch(e){$('updated').textContent='通知数据读取失败';$('notices').textContent='请检查 data/notices.json 是否存在：'+e.message}}
['search','order','eligible','active'].forEach(id=>$(id).addEventListener('input',draw));$('reload').onclick=()=>location.reload();boot();
</script></body></html>
